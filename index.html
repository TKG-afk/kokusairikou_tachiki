<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>112_tachiki_2</title>
  <style>
    :root {
      color-scheme: light;
      --page-width: min(100%, 960px);
      --bg: #ece8df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      padding: 0 12px;
    }

    .top-youtube {
      width: var(--page-width);
      margin: 0 auto 14px;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .top-youtube iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .pdf-pages {
      display: grid;
      gap: 0;
      justify-items: center;
      margin: 0 auto;
    }

    .pdf-page {
      display: block;
      width: var(--page-width);
      height: auto;
      background: #fff;
    }

    .page-frame {
      position: relative;
      width: var(--page-width);
      background: #fff;
      overflow: visible;
      z-index: 0;
    }

    .page-frame::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 420%;
      background: #fff;
      z-index: 0;
    }

    .page-frame .pdf-page {
      position: relative;
      width: 100%;
      z-index: 1;
    }

    .works-panel {
      position: absolute;
      left: 9%;
      top: 33%;
      width: 82%;
      display: grid;
      gap: 20px;
      z-index: 1;
    }

    .works-title {
      width: 50%;
      margin: 0 auto;
      color: #1c4ba6;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: clamp(14px, 1.6vw, 23px);
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }

    .works-list {
      display: grid;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .works-list img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    @media (max-width: 720px) {
      main {
        padding: 0 6px;
      }

      .works-panel {
        left: 7.5%;
        top: 31%;
        width: 85%;
        gap: 12px;
      }

      .works-list {
        gap: 10px;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      main {
        padding: 0;
      }

      .pdf-page {
        width: 100%;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>
  <main aria-label="112 tachiki 2 PDF viewer">
    <section class="top-youtube" aria-label="YouTube video">
      <iframe
        src="https://www.youtube.com/embed/oN-B9u9W87g"
        title="YouTube video player 1"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </section>
    <section class="top-youtube" aria-label="YouTube video">
      <iframe
        src="https://www.youtube.com/embed/ZVHgNVqpH2U"
        title="YouTube video player 2"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </section>
    <section class="top-youtube" aria-label="YouTube video">
      <iframe
        src="https://www.youtube.com/embed/FV0Um_H1aU8?start=178"
        title="YouTube video player 3"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </section>

    <div class="pdf-pages">
      <img class="pdf-page" src="assets/page-01.png" alt="1ページ目" width="1785" height="2194">
      <img class="pdf-page" src="assets/page-02.png" alt="2ページ目" width="1785" height="2402" loading="lazy">
      <img class="pdf-page" src="assets/page-03.png" alt="3ページ目" width="1785" height="1827" loading="lazy">
      <img class="pdf-page" src="assets/page-04.png" alt="4ページ目" width="1785" height="1869" loading="lazy">
      <img class="pdf-page" src="assets/page-05.png" alt="5ページ目" width="1785" height="2071" loading="lazy">
      <img class="pdf-page" src="assets/page-06.png" alt="6ページ目" width="1785" height="2526" loading="lazy">
      <img class="pdf-page" src="assets/page-07.png" alt="7ページ目" width="1785" height="2198" loading="lazy">
      <div class="page-frame">
        <img class="pdf-page" src="assets/page-08.png" alt="8ページ目" width="1785" height="2526" loading="lazy">
        <section class="works-panel" aria-label="学生作品と東京ゲームショウ">
          <h2 class="works-title">学生作品＆東京ゲームショウ</h2>
          <ul class="works-list">

            <li><img src="assets/sakuhin/sakuhin-02.jpg" alt="学生作品画像 2" width="2171" height="781" loading="lazy"></li>
            <li><img src="assets/sakuhin/sakuhin-03.jpg" alt="学生作品画像 3" width="2171" height="781" loading="lazy"></li>
            <li><img src="assets/sakuhin/sakuhin-04.jpg" alt="学生作品画像 4" width="2171" height="781" loading="lazy"></li>
            <li><img src="assets/sakuhin/sakuhin-05.jpg" alt="学生作品画像 5" width="2171" height="781" loading="lazy"></li>
            <li><img src="assets/sakuhin/sakuhin-06.jpg" alt="学生作品画像 6" width="2171" height="781" loading="lazy"></li>
            <li><img src="assets/sakuhin/sakuhin-07.jpg" alt="学生作品画像 7" width="2171" height="781" loading="lazy"></li>
            <li><img src="assets/sakuhin/sakuhin-08.jpg" alt="学生作品画像 8" width="2171" height="781" loading="lazy"></li>
          </ul>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
